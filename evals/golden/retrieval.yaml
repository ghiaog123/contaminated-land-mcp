# Golden set for the retrieval_citation task (docs/04-evaluation.md, task 1).
#
# authored_by: agent-drafted, pending owner review
#
# docs/04-evaluation.md says golden sets are written by a human. This one was drafted by a coding
# agent reading the source PDFs (pdftotext -layout, one page at a time) BEFORE any retrieval
# output existed. It is NOT human-authored. Until the owner reviews every item (question wording
# and gold page), published scores on it carry that caveat.
#
# Conventions
# - gold = list of acceptable {doc_id, page}. page is the 1-based PDF page index, the same
#   convention as Passage.page. It is NOT the page number printed on the page.
# - A hit is any returned passage whose (doc_id, page) is in gold.
# - Gold is a location, never a criterion value. No criterion values appear in this file.
# - kind: table = "which table / where is the list", narrative = guidance wording.
# - Do not edit an item to make a retrieval variant pass; change it with a stated reason.
authored_by: agent-drafted, pending owner review
