name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Tests marked "index" or "pdf" need the source PDFs and the built index
      # (python ingest/fetch_sources.py; python ingest/build_index.py), so CI skips them.
      - run: uv run pytest -m "not index and not pdf"
