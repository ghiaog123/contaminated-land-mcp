[project]
name = "contaminated-land-mcp"
version = "0.1.0"
description = "MCP server for Claude: cited search over contaminated-land guidance, deterministic lab screening, guarded report drafting"
readme = "README.md"
authors = [{ name = "Hieu Vu" }]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.132.0",
    "en-core-web-sm",
    "fastembed>=0.8.1",
    "fastmcp>=4.0.10",
    "inspect-ai>=0.3.275",
    "lancedb>=0.39.0",
    "openai>=3.23.0",
    "pandas>=3.0.6",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
contaminated-land-mcp = "contaminated_land.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "index: needs the built LanceDB index (run ingest/build_index.py first)",
    "pdf: needs the source PDFs in data/cache/pdf (run ingest/fetch_sources.py first)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.build-backend]
module-name = "contaminated_land"
